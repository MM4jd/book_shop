name: dev-pipeline
on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create Artifact
        run: |
          mkdir -p artifacts
          tar -czvf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts --exclude=.git --exclude=.github .
          cp artifacts/app-${{ github.sha }}.tar.gz app-artifact.tar.gz

      - name: Commit Artifact to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Add build artifact: app-${{ github.sha }}.tar.gz"
          file_pattern: 'artifacts/*.tar.gz'
          branch: dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.REGISTRY_NAME }}
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            export IMAGE_NAME=${{ steps.login-ecr.outputs.registry }}/${{ vars.REGISTRY_NAME }}:dev-${{ github.sha }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            cd book_shop
            docker compose -p dev down
            sed -i "s|image:.*book_shop_app.*|image: $IMAGE_NAME|g" docker-compose.yml
            docker compose -p dev up -d