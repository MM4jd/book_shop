version: '3.8'

services:
  # === DEV ENVIRONMENT (Artifact-First) ===
  # Philosophy: Ships a build from the artifacts/ folder.
  book-shop-dev:
    image: ${DEV_IMAGE:-128353492731.dkr.ecr.eu-central-1.amazonaws.com/book-shop-repo:dev-latest}
    container_name: book-shop-dev
    restart: always
    ports:
      - "80:8000"
    env_file: .env
    networks:
      - shop_network

  # === TEST ENVIRONMENT (Image-First) ===
  # Philosophy: Ships a fresh rebuild pushed to ECR.
  book-shop-test:
    image: ${TEST_IMAGE:-128353492731.dkr.ecr.eu-central-1.amazonaws.com/book-shop-repo:test-latest}
    container_name: book-shop-test
    restart: always
    ports:
      - "81:8000"
    env_file: .env
    networks:
      - shop_network

  # === PROD ENVIRONMENT (Promotion Only) ===
  # Philosophy: Only pulls specific versions from ECR. No building allowed.
  book-shop-prod:
    image: ${PROD_IMAGE:-128353492731.dkr.ecr.eu-central-1.amazonaws.com/book-shop-repo:prod-latest}
    container_name: book-shop-prod
    restart: always
    ports:
      - "82:8000"
    env_file: .env
    networks:
      - shop_network

networks:
  shop_network:
    driver: bridge