name: Test Deployment (Image-First)

on:
  push:
    branches: [ test ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # REQUIRED: Create the artifact so the Dockerfile can find it
      - name: Create Temporary Artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-artifact.tar.gz --exclude=artifacts --exclude=.git .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }} 
        run: |
          docker build -t $ECR_REGISTRY/book-shop-repo:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/book-shop-repo:test-latest .
          docker push $ECR_REGISTRY/book-shop-repo:$IMAGE_TAG
          docker push $ECR_REGISTRY/book-shop-repo:test-latest

      - name: Deploy to EC2 (Test Environment)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export TEST_IMAGE=${{ steps.login-ecr.outputs.registry }}/book-shop-repo:test-latest
            docker pull $TEST_IMAGE
            docker stop book-shop-test || true
            docker rm book-shop-test || true
            # Clean up ghost containers to free port 81
            docker rm -f $(docker ps -aq --filter "name=book-shop-test") || true
            docker run -d --name book-shop-test -p 81:8000 $TEST_IMAGE