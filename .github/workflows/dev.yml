name: Dev Deployment (Artifact-First)

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Unique Artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts --exclude=.git .
          cp artifacts/app-${{ github.sha }}.tar.gz artifacts/app-artifact.tar.gz

      - name: Commit Artifact to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Add build artifact app-${{ github.sha }}.tar.gz for audit trail"
          file_pattern: 'artifacts/*.tar.gz'
          branch: dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: dev-latest
        run: |
          docker build -t $ECR_REGISTRY/book-shop-repo:$IMAGE_TAG .
          docker push $ECR_REGISTRY/book-shop-repo:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export DEV_IMAGE=${{ steps.login-ecr.outputs.registry }}/book-shop-repo:dev-latest
            docker pull $DEV_IMAGE
            docker rm -f $(docker ps -aq) || true
            docker run -d --name book-shop-dev -p 80:8000 $DEV_IMAGE