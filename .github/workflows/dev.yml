name: Dev Deployment (Artifact-First)

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Unique Artifact
        run: |
          # Use the commit SHA to create a unique filename for the audit trail [cite: 19, 81]
          # We also create a generic 'app-artifact.tar.gz' for the Dockerfile to use easily
          tar -czf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts --exclude=.git .
          cp artifacts/app-${{ github.sha }}.tar.gz artifacts/app-artifact.tar.gz

      - name: Commit Artifact to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          [cite_start]commit_message: "Add build artifact app-${{ github.sha }}.tar.gz for audit trail [cite: 20, 22]"
          file_pattern: 'artifacts/*.tar.gz'
          branch: dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: dev-latest
        run: |
          # The Dockerfile now builds from the artifact copied into it [cite: 23, 24]
          docker build -t $ECR_REGISTRY/book-shop-repo:$IMAGE_TAG .
          docker push $ECR_REGISTRY/book-shop-repo:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Automating the update of docker-compose.yml as required for Group of 3 
            export DEV_IMAGE=${{ steps.login-ecr.outputs.registry }}/book-shop-repo:dev-latest
            docker compose pull book-shop-dev
            docker compose up -d book-shop-dev